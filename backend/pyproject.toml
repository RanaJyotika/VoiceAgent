[project]
name = "voice-agent"
version = "0.1.0"
description = "AI outbound calling agent on Gemini Live: order confirmation and abandoned cart recovery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "websockets>=13",
    "onnxruntime>=1.20",   # runs the Silero speech detector (app/models/silero_vad.onnx)
    "numpy>=2.0",
    "livekit>=1.1",        # its rtc.AudioProcessingModule: WebRTC noise suppression + echo cancellation (app/line_audio.py)
    "sherpa-onnx>=1.12",   # runs the caller voice fingerprint model (app/voiceprint.py)
    "sarvamai>=0.1.36",
    "pymongo>=4.10",       # reads the product catalogue from the Vedic Vaibhav MongoDB (app/catalog.py)
    "lameenc>=1.7",        # MP3s of call recordings for the Google Drive copy (app/recordings.py, app/drive_sync.py)
]

[tool.uv]
package = false
